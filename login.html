<!doctype html>
<!-- Демо-версия для GitHub Pages. Файл собран deploy/build-pages.py из web/ — правьте web/, не этот файл. -->

<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Демо · Вход · Hettich · Полезные материалы</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg transform='skewY(-30) translate(0 18)'%3E%3Crect x='6' y='2' width='20' height='4' fill='%2300569d'/%3E%3Crect x='6' y='8' width='20' height='4' fill='%2300965f'/%3E%3Crect x='6' y='14' width='20' height='4' fill='%23fab900'/%3E%3Crect x='6' y='20' width='20' height='4' fill='%23e20613'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="web/app.css">
<style>
body { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(380px, 1fr); grid-template-rows: minmax(100vh, auto); }
.side {
  position: relative; overflow: hidden; color: #fff; padding: 48px; display: flex; flex-direction: column; justify-content: space-between;
  background: #121212;
}
.side::before { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, rgba(10, 10, 11, .88) 0%, rgba(10, 10, 11, .55) 55%, rgba(10, 10, 11, .25)); }
.side > * { position: relative; }
.side .logo { width: 110px; color: #fff; }
.side h2 { margin: 0; font: 700 clamp(44px, 6vw, 88px)/.9 var(--font-head); text-transform: uppercase; max-width: 9ch; }
.side h2 span { display: block; color: #fff; }
.side p { max-width: 420px; color: #cfd1d6; margin: 18px 0 0; }
.big-stripes { position: absolute; right: -40px; top: 64px; display: grid; gap: 10px; transform: skewY(-30deg); opacity: .95; }
.big-stripes i { display: block; width: 220px; height: 16px; transform-origin: right; animation: slide .9s var(--ease) both; }
.big-stripes i:nth-child(1) { background: var(--s-blue); }
.big-stripes i:nth-child(2) { background: var(--s-green); animation-delay: .08s; }
.big-stripes i:nth-child(3) { background: var(--s-yellow); animation-delay: .16s; }
.big-stripes i:nth-child(4) { background: var(--s-red); animation-delay: .24s; }
@keyframes slide { from { transform: scaleX(0); } }

.panel { display: grid; place-items: center; padding: 48px 32px; background: #fff; }
.form { width: min(380px, 100%); display: grid; gap: 18px; }
.form .kicker { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--steel); display: flex; gap: 12px; align-items: center; }
.form .kicker .stripes i { width: 16px; height: 3px; }
.form .kicker .stripes { gap: 2px; }
.form h1 { margin: 0; font: 700 44px/1 var(--font-head); text-transform: uppercase; }
.form .intro { margin: -6px 0 6px; color: var(--steel); font-size: 15px; }
.form .btn { height: 50px; font-size: 15px; }
.back-link { justify-self: start; font-size: 13px; font-weight: 600; color: var(--steel); text-decoration: none; margin-bottom: -6px; }
.back-link:hover { color: var(--ink); }
.help { margin-top: 10px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 13px; color: var(--steel); line-height: 1.5; }
.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

@media (max-width: 860px) {
  body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .side { min-height: 230px; padding: 22px 20px; background-position: 72% center; }
  .side::before { background: rgba(10, 10, 11, .8); }  /* на узком экране кадр с собственным текстом не должен проступать */
  .side h2 { font-size: 44px; }
  .side p { display: none; }
  .big-stripes { top: 28px; }
  .big-stripes i { width: 140px; height: 10px; }
  body { grid-template-rows: auto 1fr; }
  .panel { padding: 32px 16px 48px; align-items: start; }
}
</style>
</head>
<body>
<section class="side" aria-hidden="true">
  <div class="logo" id="logo"></div>
  <div>
    <h2>It's all in <span>Hettich</span></h2>
  </div>
  <div class="big-stripes"><i></i><i></i><i></i><i></i></div>
</section>

<main class="panel">
  <form class="form" id="form" autocomplete="on" novalidate>
    <a class="back-link" href="index.html">← К материалам</a>
    <div class="kicker"><span class="stripes"><i></i><i></i><i></i><i></i></span>Для сотрудников</div>
    <h1>Вход</h1>
    <p class="intro">Логин и пароль выдаёт администратор. Смотреть и скачивать материалы можно без входа.</p>
    <div class="field">
      <label for="login">Логин</label>
      <input class="input" id="login" name="username" autocomplete="username" required autocapitalize="off" spellcheck="false">
    </div>
    <div class="field">
      <label for="password">Пароль</label>
      <div class="pw-wrap">
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="button" class="pw-toggle" aria-label="Показать пароль"></button>
      </div>
    </div>
    <div class="form-error" id="err" aria-live="polite"></div>
    <button class="btn block" type="submit" id="go">Войти</button>
    <div class="help">Забыли пароль? Напишите администратору.
      <div style="margin-top:10px"><button type="button" class="link-btn" id="recover">Вход по ключу восстановления</button></div></div>
  </form>
</main>

<script src="web/demo.js"></script>
<script src="web/common.js"></script>
<script>
$('#logo').innerHTML = LOGO;
bindPwToggles();
$('#login').focus();
$('#recover').onclick = () => recoverModal($('#login').value.trim());
$('#form').onsubmit = async (e) => {
  e.preventDefault();
  const err = $('#err'), go = $('#go');
  err.textContent = '';
  if (!$('#login').value.trim() || !$('#password').value) { err.textContent = 'Введите логин и пароль'; return; }
  go.disabled = true; go.textContent = 'Проверяем…';
  try {
    await api('/api/login', { login: $('#login').value.trim(), password: $('#password').value });
    location.href = SITE.home;
  } catch (ex) {
    err.textContent = ex.message;
    $('#form').classList.remove('shake'); void $('#form').offsetWidth; $('#form').classList.add('shake');
    go.disabled = false; go.textContent = 'Войти';
  }
};
</script>
</body>
</html>
